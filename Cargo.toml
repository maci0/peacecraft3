[workspace]
resolver = "2"
members = [
    "crates/pcx-mpq",
    "crates/pcx-casc",
    "crates/pcx-assets",
    "crates/pcx-blp",
    "crates/pcx-tga",
    "crates/pcx-mdl",
    "crates/pcx-slq",
    "crates/pcx-script",
    "crates/pcx-trig",
    "crates/pcx-objects",
    "crates/pcx-map",
    "crates/pcx-tera",
    "crates/pcx-net",
    "crates/pcx-sim",
    "crates/pcx-play",
    "crates/pcx-gfx",
    "crates/peacecraft3",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"

[workspace.dependencies]
pcx-mpq = { path = "crates/pcx-mpq" }
pcx-casc = { path = "crates/pcx-casc" }
pcx-assets = { path = "crates/pcx-assets" }
pcx-blp = { path = "crates/pcx-blp" }
pcx-tga = { path = "crates/pcx-tga" }
pcx-mdl = { path = "crates/pcx-mdl" }
pcx-slq = { path = "crates/pcx-slq" }
pcx-script = { path = "crates/pcx-script" }
pcx-trig = { path = "crates/pcx-trig" }
pcx-objects = { path = "crates/pcx-objects" }
pcx-map = { path = "crates/pcx-map" }
pcx-tera = { path = "crates/pcx-tera" }
pcx-sim = { path = "crates/pcx-sim" }
pcx-play = { path = "crates/pcx-play" }
pcx-gfx = { path = "crates/pcx-gfx" }

bevy = { version = "0.20", default-features = false, features = [
    "default_app",
    "bevy_animation",
    "bevy_curve",
    "bevy_pbr",
    "bevy_ui_render",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "zstd_rust",
    "webgl2",
    "x11",
    "wayland",
] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2 = "1"
implode = "0.1"
sha2 = { version = "0.11.1", default-features = false }

[patch.crates-io]
bevy_render = { path = "vendor/bevy_render" }
bevy_picking = { path = "vendor/bevy_picking" }
bevy_ui = { path = "vendor/bevy_ui" }
bevy_sprite = { path = "vendor/bevy_sprite" }

[profile.release]
incremental = true
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
incremental = true
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = 1
strip = false
