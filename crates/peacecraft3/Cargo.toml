[package]
name = "peacecraft3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Faithful Warcraft III reimplementation on the Bevy engine"

[features]
profile-cpu = ["bevy/trace_chrome", "pcx-play/profile-cpu", "pcx-gfx/profile-cpu"]
profile-gpu = ["pcx-gfx/profile-gpu"]
# Synthetic inventory fixtures and their ECS tests. Run tests with
# `cargo test -p peacecraft3 --features test-fixtures`.
test-fixtures = ["pcx-play/test-fixtures"]

[dependencies]
pcx-mpq.workspace = true
pcx-sim.workspace = true
pcx-play.workspace = true
pcx-script.workspace = true
pcx-map.workspace = true
pcx-objects.workspace = true
pcx-assets.workspace = true
pcx-gfx.workspace = true
pcx-blp.workspace = true
pcx-tga.workspace = true
pcx-mdl.workspace = true
pcx-slq.workspace = true
pcx-tera.workspace = true
bevy = { version = "0.20", features = ["mp3", "wav"] }
anyhow.workspace = true
thiserror.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing.workspace = true
tracing-subscriber.workspace = true
getrandom = "0.4.3"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

# The browser target (PLAN.md §3.8). A wasm build needs glue to call into and out
# of JavaScript, which only exists for wasm32 — not a gate to make a desktop
# build compile, and it changes nothing for one.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# `Window`, for the one capability question the browser entry point asks: is
# there a DOM to attach a canvas to?
web-sys = { version = "0.3", features = ["Window"] }

[dev-dependencies]
flate2.workspace = true
sha2.workspace = true

[lints]
workspace = true
