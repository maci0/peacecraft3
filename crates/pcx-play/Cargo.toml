pcx-tga.workspace = true
pcx-objects.workspace = true
pcx-script.workspace = true
pcx-trig.workspace = true
pcx-map.workspace = true
pcx-mpq.workspace = true
pcx-mdl.workspace = true
pcx-slq.workspace = true
thiserror.workspace = true
sha2.workspace = true
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
