[package]
name = "pcx-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Transports, command codec and authoritative lockstep server"

[features]
session-server = ["dep:tungstenite"]

[[example]]
name = "session_server"
required-features = ["session-server"]

[dependencies]
pcx-sim.workspace = true
thiserror.workspace = true

[dev-dependencies]
pcx-mpq.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.28", optional = true, default-features = false, features = ["handshake"] }
