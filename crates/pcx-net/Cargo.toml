[package]
name = "pcx-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Transports, command codec and authoritative lockstep server"

[features]
session-server = ["dep:tungstenite"]

[[example]]
name = "session_server"
required-features = ["session-server"]

[[test]]
name = "local_peers"
required-features = ["session-server"]

[dependencies]
pcx-sim.workspace = true
pcx-mpq.workspace = true
pcx-map.workspace = true
thiserror.workspace = true
crc32fast = "1.5.2"
sha1 = "0.11.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.30", optional = true, default-features = false, features = ["handshake"] }

[lints]
workspace = true
