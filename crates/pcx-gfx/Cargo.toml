[package]
name = "pcx-gfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bevy asset loaders for the pcx-* decoders"

[features]
profile-cpu = ["dep:tracing", "bevy/trace", "pcx-mdl/profile-cpu", "pcx-blp/profile-cpu", "pcx-mpq/profile-cpu"]
profile-gpu = []

[dependencies]
tracing = { workspace = true, optional = true }
bevy = { version = "0.20", features = ["dds"] }
pcx-mpq.workspace = true
pcx-blp.workspace = true
pcx-tga.workspace = true
pcx-mdl.workspace = true
pcx-map.workspace = true
pcx-tera.workspace = true
pcx-slq.workspace = true
thiserror.workspace = true
image = { version = "0.25.10", default-features = false, features = ["dds"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
pcx-casc.workspace = true

[lints]
workspace = true
